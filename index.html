<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>微信授权登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; font-family: system-ui, 'Segoe UI', sans-serif; }
        .container {
            max-width: 400px; margin: 0 auto; padding: 2rem 1.5rem;
            text-align: center; margin-top: 30vh;
        }
        .tip { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .auth-btn {
            width: 80%; padding: 12px; border: none; border-radius: 60px;
            background: #07c160; color: #fff; font-size: 1rem; font-weight: bold;
            cursor: pointer;
        }
        .auth-btn:hover { background: #06ad56; }
    </style>
</head>
<body>
    <div class="container">
        <p class="tip">需要微信授权后才能继续</p>
        <button class="auth-btn" id="authBtn">微信授权登录</button>
    </div>
    <script>
        (function() {
            // 生成 16 位唯一访问标识
            function generateTraceId() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let s = '';
                for (let i = 0; i < 16; i++) {
                    s += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return s;
            }

            // 1. 读 URL 参数：优先 query（?t=&v=），兼容 hash（/#/?t=&v=）
            function readShareParams() {
                const search = new URLSearchParams(location.search);
                const hash = location.hash || '';
                const hashQuery = hash.includes('?') ? hash.slice(hash.indexOf('?') + 1) : '';
                const fromHash = new URLSearchParams(hashQuery);
                return {
                    t: search.get('t') || fromHash.get('t') || '',
                    v: search.get('v') || fromHash.get('v') || generateTraceId()
                };
            }

            const { t, v } = readShareParams();

            // 2. 点击按钮：一次调用 oauth-jump，后端解析下一步链接并返回微信授权地址，直接跳转
            document.getElementById('authBtn').addEventListener('click', function() {
                fetch(`https://javaapi.tthaol.com/app-api/site/share/oauth-jump?type=31&t=${encodeURIComponent(t)}&v=${encodeURIComponent(v)}`)
                    .then(res => res.json())
                    .then(oauthData => {
                        if (oauthData && oauthData.code === 0 && oauthData.data) {
                            location.href = oauthData.data;
                        } else {
                            console.error('获取微信授权地址失败:', oauthData);
                        }
                    })
                    .catch(err => console.error('请求失败:', err));
            });
        })();
    </script>
</body>
</html>
